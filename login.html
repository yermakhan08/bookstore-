{% extends "base.html" %}
{% block body %}

<h2 class="text-3xl font-bold mb-4">Login</h2>

<form method="post" class="bg-white p-6 shadow rounded-lg max-w-md">
    <label>Email:</label>
    <input name="email" class="border p-2 rounded w-full mb-4">

    <label>Password:</label>
    <input name="password" type="password" class="border p-2 rounded w-full mb-4">

    <button class="bg-blue-600 text-white px-4 py-2 rounded">
        Login
    </button>
</form>

{% endblock %}
